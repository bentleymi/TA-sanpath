[sanpath:status]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 400000

[sanpath:metrics]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
DATETIME_CONFIG = CURRENT
TRUNCATE = 400000
TRANSFORMS-sanpath-metrics = sanpath_metric_name
METRIC-SCHEMA-TRANSFORMS = metric-schema:sanpath
